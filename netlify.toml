# Netlify build settings for the Vite/React frontend. The legacy backend/
# folder is not deployed.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# serverless functions (order emails) — path is relative to `base`; esbuild
# bundles the shared catalogue import from src/shared
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback: client-side routes like /mug/:id must resolve to index.html
# (also declared in frontend/public/_redirects as the canonical Vite pattern).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
