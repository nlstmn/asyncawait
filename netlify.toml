# Netlify build settings for the Vite/React frontend (repo is a monorepo:
# frontend/ + backend/). Netlify only builds & serves the static frontend.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA fallback: client-side routes like /product/:id must resolve to index.html
# (also declared in frontend/public/_redirects as the canonical Vite pattern).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
